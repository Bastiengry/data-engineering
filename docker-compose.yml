x-spark-common: &spark-common
  image: apache/spark-py:latest
  volumes:
    - ./spark/app:/opt/spark/work-dir/app
    - ./data:/opt/spark/work-dir/data-shared
  networks:
    - data-network
  environment:
    - SPARK_MASTER_URL=spark://spark-master:7077
    - SPARK_WORKER_DIR=/tmp/spark-work

services:
  # --- Service Postgres pour le Backend Airflow ---
  postgres-airflow:
    image: postgres:13
    container_name: postgres-airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-network

  # --- Initialisation d'Airflow ---
  airflow-init:
    build: .
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=ma_cle_secrete_super_securisee_12345
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - data-network

  # --- Webserver Airflow ---
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./spark/app:/opt/airflow/spark/app
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=50000
      - AIRFLOW__WEBSERVER__SECRET_KEY=ma_cle_secrete_super_securisee_12345
    networks:
      - data-network

  # --- Scheduler Airflow ---
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./spark/app:/opt/airflow/spark/app
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=50000
      - AIRFLOW__WEBSERVER__SECRET_KEY=ma_cle_secrete_super_securisee_12345
    networks:
      - data-network

  # --- Services Spark ---
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "9090:8080" # Interface web Spark Master
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master

  # --- Service Postgres pour le Datamart ---
  postgres-datamart:
    image: postgres:13
    container_name: postgres-datamart
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=datamart
      - POSTGRES_PASSWORD=datamart
      - POSTGRES_DB=datamart
    volumes:
      - datamart-db-volume:/var/lib/postgresql/data
    networks:
      - data-network

  # --- Adminer (GUI SQL) ---
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8081:8080"
    networks:
      - data-network

volumes:
  airflow-db-volume:
  datamart-db-volume:

networks:
  data-network:
    driver: bridge